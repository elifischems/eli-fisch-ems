.brand,.sub{display:none}
main{max-width:860px;margin:0 auto;padding:14px}
h2{font:700 24px "Cormorant Garamond",Georgia,serif;margin:18px 0 8px}
.locs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--txt);border-radius:99px;padding:9px 16px;font:600 15px inherit;font-family:inherit;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--navy);color:var(--cream);border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
.pb{min-height:92px;border-radius:3px;border:1.5px solid var(--line);background:var(--card);color:var(--txt);padding:10px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;font-family:inherit;cursor:pointer;position:relative;transition:transform .08s}
.pb:active{transform:scale(.96);filter:brightness(.94)}
.pb .n{font:700 20px/1.15 "Cormorant Garamond",Georgia,serif}
.pb .p{color:#8f7440;font:700 20px "Cormorant Garamond",Georgia,serif}
.pb .c{position:absolute;top:8px;right:10px;background:var(--navy);color:var(--cream);border-radius:99px;font-size:12px;font-weight:700;min-width:24px;text-align:center;padding:1px 7px}
.pb.warm,.pb.roll,.pb.other{border-top:2px solid #b39a62;box-shadow:0 1px 0 rgba(255,255,255,.5)}
